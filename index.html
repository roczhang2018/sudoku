<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇 Snake</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>贪吃蛇 Snake</h1>
    <div class="controls">
      <button id="start">开始游戏</button>
      <button id="pause">暂停</button>
      <button id="restart">重新开始</button>
      <select id="difficulty">
        <option value="easy">简单</option>
        <option value="medium" selected>中等</option>
        <option value="hard">困难</option>
      </select>
    </div>
    <div class="speed-control">
      <label for="speedSlider">游戏速度:</label>
      <input type="range" id="speedSlider" min="30" max="500" value="120" step="10">
      <span id="speedValue">120ms</span>
    </div>
    <div class="game-area">
      <canvas id="gameCanvas" width="800" height="400"></canvas>
      <div class="score-panel">
        <div class="score-item">
          <span>玩家分数:</span>
          <span id="currentScore">0</span>
        </div>
        <div class="score-item">
          <span>AI分数:</span>
          <span id="aiScore">0</span>
        </div>
        <div class="score-item">
          <span>最高分:</span>
          <span id="highScore">0</span>
        </div>
        <div class="score-item">
          <span>生命:</span>
          <span id="lives">3</span>
        </div>
      </div>
    </div>
    <div class="status" id="status">欢迎来到贪吃蛇对战！音乐已开始播放，按开始游戏开始，使用方向键控制。与AI蛇比赛！棋盘上有3-5个食物，全部吃完后重新分配！边界可循环穿越！</div>
    <div class="audio-controls">
      <button id="musicToggle">🎵 Family Song: 开</button>
      <button id="soundToggle">🔊 音效: 开</button>
      <button id="infiniteToggle">🔄 无限循环: 开</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
