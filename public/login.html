<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户登录 - 贪吃蛇 Snake</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div id="auth-container">
    <div class="auth-header">
      <h1>🐍 贪吃蛇 Snake</h1>
      <p>请登录或注册以开始游戏</p>
    </div>
    
    <div class="auth-tabs">
      <button id="loginTab" class="tab-button active">登录</button>
      <button id="registerTab" class="tab-button">注册</button>
    </div>
    
    <!-- 登录表单 -->
    <div id="loginForm" class="auth-form active">
      <form id="loginFormElement">
        <div class="form-group">
          <label for="loginUsername">用户名</label>
          <input type="text" id="loginUsername" name="username" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" name="password" required>
        </div>
        <button type="submit" class="auth-button">登录</button>
      </form>
    </div>
    
    <!-- 注册表单 -->
    <div id="registerForm" class="auth-form">
      <form id="registerFormElement">
        <div class="form-group">
          <label for="registerUsername">用户名</label>
          <input type="text" id="registerUsername" name="username" required minlength="3" maxlength="20">
          <small>3-20个字符</small>
        </div>
        <div class="form-group">
          <label for="registerPassword">密码</label>
          <input type="password" id="registerPassword" name="password" required minlength="6">
          <small>至少6个字符</small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        <div class="form-group">
          <label for="email">邮箱（可选）</label>
          <input type="email" id="email" name="email">
        </div>
        <button type="submit" class="auth-button">注册</button>
      </form>
    </div>
    
    <div class="auth-message" id="authMessage"></div>
    
    <div class="auth-footer">
      <p>🎮 登录后即可享受完整的贪吃蛇对战体验！</p>
    </div>
  </div>
  
  <script type="module" src="js/auth.js"></script>
</body>
</html>
